name: Atualizar patch notes

# Busca as patch notes oficiais, mescla no data/patchnotes.json, regera os
# wrappers JS e commita. O commit feito com o GITHUB_TOKEN NAO dispara o
# workflow de publicacao por si so; por isso o "Publicar site" escuta este
# workflow terminar (evento workflow_run).

on:
  schedule:
    # Todo dia as 09:00 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita duas rodadas mexendo no mesmo arquivo ao mesmo tempo.
concurrency:
  group: patch-notes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: windows-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Buscar e mesclar patch notes
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tools\update-patch-notes.ps1

      - name: Regerar os wrappers JS
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tools\build-data.ps1

      - name: Commitar, se houver mudanca
        shell: powershell
        run: |
          git config user.name  "r6hub-bot"
          git config user.email "r6hub-bot@users.noreply.github.com"
          git add data/patchnotes.json assets/js/data/patchnotes.js
          if (git diff --cached --quiet) {
            Write-Host "Sem mudancas. Nada a commitar."
          } else {
            git commit -m "atualiza patch notes automaticamente"
            git push
          }
